<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyHub 🏠</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Nunito', sans-serif; background: #f0f4ff; min-height: 100vh; max-width: 520px; margin: 0 auto; padding-bottom: 32px; }

    /* ── Login ── */
    #loginScreen { position: fixed; inset: 0; background: linear-gradient(160deg, #6a11cb 0%, #c471ed 50%, #f5576c 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; padding: 24px; }
    #loginScreen.hidden { display: none; }
    .login-logo { font-size: 52px; margin-bottom: 8px; animation: bounce 1.8s infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .login-title { font-size: 32px; font-weight: 900; color: white; letter-spacing: -0.5px; }
    .login-sub { font-size: 16px; color: rgba(255,255,255,0.75); font-weight: 700; margin-top: 6px; margin-bottom: 32px; }
    .login-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; width: 100%; max-width: 340px; }
    .login-grid .login-card:nth-child(5) { grid-column: 1/-1; max-width: 152px; margin: 0 auto; }
    .login-card { background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 22px; padding: 20px 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.18s, background 0.18s, box-shadow 0.18s; backdrop-filter: blur(6px); }
    .login-card:hover { transform: scale(1.06); background: rgba(255,255,255,0.28); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
    .login-card-emoji { width: 62px; height: 62px; background: rgba(255,255,255,0.25); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; border: 2px solid rgba(255,255,255,0.5); }
    .login-card-name { font-size: 15px; font-weight: 900; color: white; }
    .login-card-role { font-size: 11px; color: rgba(255,255,255,0.65); font-weight: 700; }

    /* ── App ── */
    #app { display: none; }
    #app.visible { display: block; }

    /* ── Header ── */
    .header { background: linear-gradient(135deg, #6a11cb 0%, #f093fb 55%, #f5576c 100%); padding: 16px 16px 14px; color: white; }
    .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
    .header-title { font-size: 22px; font-weight: 900; letter-spacing: -0.5px; }
    .header-greeting { font-size: 18px; font-weight: 900; }
    .switch-btn { background: rgba(255,255,255,0.2); border: 1.5px solid rgba(255,255,255,0.45); border-radius: 20px; color: white; font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 800; padding: 5px 12px; cursor: pointer; transition: background 0.18s; white-space: nowrap; }
    .switch-btn:hover { background: rgba(255,255,255,0.32); }
    .header-date { font-size: 12px; opacity: 0.8; font-weight: 600; margin-bottom: 14px; }
    .avatar-row { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; }
    .avatar-row::-webkit-scrollbar { display: none; }
    .avatar-chip { display: flex; flex-direction: column; align-items: center; cursor: pointer; flex-shrink: 0; transition: transform 0.15s; }
    .avatar-chip:active { transform: scale(0.9); }
    .avatar-bubble { width: 44px; height: 44px; background: rgba(255,255,255,0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 21px; border: 2.5px solid rgba(255,255,255,0.35); transition: all 0.2s; }
    .avatar-chip.active .avatar-bubble { background: white; border-color: white; box-shadow: 0 0 0 3px rgba(255,255,255,0.4); }
    .avatar-label { font-size: 10px; font-weight: 800; margin-top: 4px; opacity: 0.9; }

    /* ── Tab bar ── */
    .tab-bar { display: flex; background: white; border-bottom: 2px solid #e8edf5; position: sticky; top: 0; z-index: 100; box-shadow: 0 3px 10px rgba(0,0,0,0.08); overflow-x: auto; }
    .tab-bar::-webkit-scrollbar { display: none; }
    .tab { flex: 0 0 auto; min-width: 72px; padding: 11px 10px 9px; text-align: center; font-size: 11px; font-weight: 800; color: #9aa5b8; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; user-select: none; white-space: nowrap; }
    .tab.active { color: #6a11cb; border-bottom-color: #6a11cb; }
    .tab-icon { font-size: 19px; display: block; margin-bottom: 2px; }

    /* ── Content / Cards ── */
    .content { padding: 14px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: white; border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 14px rgba(0,0,0,0.06); }
    .card-title { font-size: 16px; font-weight: 900; color: #1a202c; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
    .welcome-banner { border-radius: 18px; padding: 18px 16px; margin-bottom: 14px; color: white; font-weight: 800; }
    .welcome-banner .wb-emoji { font-size: 36px; }
    .welcome-banner .wb-name  { font-size: 22px; font-weight: 900; }
    .welcome-banner .wb-sub   { font-size: 12px; opacity: 0.85; margin-top: 2px; }

    /* ── Task rows ── */
    .task-row { display: flex; align-items: center; gap: 9px; padding: 9px 0; border-bottom: 1px solid #f3f6ff; }
    .task-row:last-of-type { border-bottom: none; padding-bottom: 0; }
    .task-row:first-of-type { padding-top: 0; }
    .check-box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid #c8d3e8; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 13px; transition: all 0.18s; }
    .check-box.done { background: linear-gradient(135deg, #6a11cb, #f093fb); border-color: transparent; color: white; }
    .check-box.readonly { cursor: default; }
    .task-text { flex: 1; font-size: 14px; font-weight: 700; color: #2d3748; }
    .task-text.done { text-decoration: line-through; color: #a0aec0; }
    .mini-avatar { font-size: 18px; width: 30px; height: 30px; background: #f3f6ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .del-btn { background: none; border: none; font-size: 17px; cursor: pointer; opacity: 0.35; line-height: 1; padding: 0 3px; transition: opacity 0.15s; }
    .del-btn:hover { opacity: 0.7; }
    .pri { font-size: 9px; font-weight: 900; padding: 2px 7px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.3px; flex-shrink: 0; }
    .pri-high   { background: #fff0f0; color: #e53e3e; }
    .pri-medium { background: #fffbeb; color: #c87b00; }
    .pri-low    { background: #f0fff4; color: #38a169; }

    /* ── Stars ── */
    .star-chart { display: flex; flex-direction: column; gap: 14px; }
    .star-row { display: flex; align-items: center; gap: 10px; }
    .star-person { display: flex; align-items: center; gap: 6px; min-width: 80px; }
    .star-person-emoji { font-size: 20px; }
    .star-person-name { font-size: 13px; font-weight: 800; color: #2d3748; }
    .stars { display: flex; gap: 3px; }
    .star { font-size: 24px; cursor: pointer; transition: transform 0.15s; filter: grayscale(1) opacity(0.25); line-height: 1; }
    .star.on { filter: none; }
    .star:hover { transform: scale(1.25); }
    .star.readonly { cursor: default; }
    .star.readonly:hover { transform: none; }
    .star-count { font-size: 11px; color: #a0aec0; font-weight: 800; margin-left: 3px; }
    .star-row.mine { background: #fefce8; border-radius: 12px; padding: 6px 10px; margin: 0 -10px; }

    /* ── Subject badges ── */
    .badge { font-size: 10px; font-weight: 900; padding: 3px 9px; border-radius: 20px; flex-shrink: 0; }
    .b-Maths   { background: #ebf4ff; color: #2b6cb0; }
    .b-English { background: #f0fff4; color: #276749; }
    .b-Science { background: #faf5ff; color: #6b46c1; }
    .b-History { background: #fffaf0; color: #c05621; }
    .b-Art     { background: #fff5f7; color: #b83280; }

    /* ── Homework ── */
    .hw-item { padding: 10px 0; border-bottom: 1px solid #f3f6ff; }
    .hw-item:last-child { border-bottom: none; }
    .hw-head { display: flex; align-items: center; gap: 7px; }
    .hw-desc-text { flex: 1; font-size: 13px; font-weight: 700; color: #2d3748; }
    .hw-desc-text.done { text-decoration: line-through; color: #a0aec0; }
    .hw-due { font-size: 11px; color: #a0aec0; font-weight: 600; margin-top: 4px; margin-left: 31px; }

    /* ── Grocery ── */
    .grocery-add { display: flex; gap: 7px; margin-bottom: 14px; flex-wrap: wrap; }
    .g-input { flex: 1; min-width: 120px; padding: 9px 13px; border: 2px solid #e8edf5; border-radius: 12px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; outline: none; }
    .g-input:focus { border-color: #6a11cb; }
    .g-cat { padding: 9px 8px; border: 2px solid #e8edf5; border-radius: 12px; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; outline: none; background: white; cursor: pointer; }
    .g-item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; background: #f8faff; border-radius: 11px; margin-bottom: 6px; }
    .g-item-text { flex: 1; font-size: 14px; font-weight: 700; color: #2d3748; }
    .g-item-text.done { text-decoration: line-through; color: #a0aec0; }
    .cat-title { font-size: 11px; font-weight: 900; color: #8896ab; text-transform: uppercase; letter-spacing: 0.6px; margin: 10px 0 7px; }
    .cat-title:first-child { margin-top: 0; }

    /* ── Buttons ── */
    .btn { padding: 9px 16px; border: none; border-radius: 12px; background: linear-gradient(135deg, #6a11cb, #f093fb); color: white; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800; cursor: pointer; transition: opacity 0.18s, transform 0.12s; flex-shrink: 0; }
    .btn:active { opacity: 0.8; transform: scale(0.96); }
    .btn-sm { padding: 8px 14px; border: none; border-radius: 10px; background: linear-gradient(135deg, #6a11cb, #f093fb); color: white; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800; cursor: pointer; flex-shrink: 0; }
    .btn-ghost { padding: 6px 12px; border: none; border-radius: 9px; background: #f0f4ff; color: #718096; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; display: block; margin-top: 10px; margin-left: auto; }
    .btn-ghost:hover { background: #e2e8f0; }

    /* ── Forms ── */
    .add-form { margin-top: 12px; padding-top: 12px; border-top: 1.5px dashed #e8edf5; display: flex; flex-direction: column; gap: 8px; }
    .form-row { display: flex; gap: 7px; }
    .add-input { flex: 1; padding: 9px 12px; border: 2px solid #e8edf5; border-radius: 11px; font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; outline: none; }
    .add-input:focus { border-color: #6a11cb; }
    select { padding: 9px 8px; border: 2px solid #e8edf5; border-radius: 11px; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; outline: none; background: white; cursor: pointer; }
    select:focus { border-color: #6a11cb; }
    input[type="date"], input[type="time"] { padding: 9px 8px; border: 2px solid #e8edf5; border-radius: 11px; font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700; outline: none; background: white; }
    input[type="date"]:focus, input[type="time"]:focus { border-color: #6a11cb; }

    /* ── Child tabs ── */
    .child-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .child-tab { padding: 7px 16px; border-radius: 22px; background: #f0f4ff; font-size: 13px; font-weight: 800; color: #718096; cursor: pointer; transition: all 0.2s; user-select: none; }
    .child-tab.active { background: linear-gradient(135deg, #6a11cb, #f093fb); color: white; }
    .person-header { font-size: 15px; font-weight: 900; color: #1a202c; margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }
    .card.mine-card { border: 2px solid #c471ed; }
    .empty { text-align: center; padding: 22px; color: #a0aec0; font-size: 14px; font-weight: 700; }

    /* ════════════════════════════════════════
       CALENDAR
    ════════════════════════════════════════ */
    /* GCal connect bar */
    .gcal-bar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: #f8faff; border-radius: 12px; margin-bottom: 14px; }
    .gcal-status { flex: 1; font-size: 13px; font-weight: 700; color: #4a5568; }
    .gcal-status .connected { color: #38a169; }
    .gcal-status .needs-setup { color: #e53e3e; font-size: 11px; }
    .gcal-btn { padding: 7px 14px; border: none; border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap; }
    .gcal-btn-connect    { background: #4285f4; color: white; }
    .gcal-btn-disconnect { background: #f0f4ff; color: #718096; }
    .gcal-btn-refresh    { background: #f0f4ff; color: #4285f4; margin-right: 4px; }
    .gcal-btn:disabled   { opacity: 0.5; cursor: default; }
    .g-logo { font-size: 16px; }

    /* Calendar grid */
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .cal-nav-btn { background: #f0f4ff; border: none; border-radius: 10px; width: 34px; height: 34px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.18s; color: #6a11cb; font-weight: 900; }
    .cal-nav-btn:hover { background: #e0e8ff; }
    .cal-month-label { font-size: 18px; font-weight: 900; color: #1a202c; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow { text-align: center; font-size: 10px; font-weight: 900; color: #a0aec0; text-transform: uppercase; padding: 4px 0 6px; }
    .cal-day { aspect-ratio: 1; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 5px; cursor: pointer; transition: background 0.15s; position: relative; }
    .cal-day:hover { background: #f0f4ff; }
    .cal-day.other-month .cal-day-num { color: #d0d8e8; }
    .cal-day.today { background: #f0f4ff; }
    .cal-day.today .cal-day-num { color: #6a11cb; font-weight: 900; }
    .cal-day.selected { background: linear-gradient(135deg, #6a11cb, #f093fb) !important; }
    .cal-day.selected .cal-day-num { color: white !important; }
    .cal-day-num { font-size: 13px; font-weight: 700; color: #2d3748; line-height: 1; }
    .cal-dots { display: flex; gap: 2px; flex-wrap: wrap; justify-content: center; margin-top: 3px; padding: 0 2px; }
    .cal-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .cal-day.selected .cal-dot { opacity: 0.85; }

    /* Day panel */
    .day-panel { margin-top: 14px; }
    .day-panel-title { font-size: 15px; font-weight: 900; color: #1a202c; margin-bottom: 10px; }
    .event-item { display: flex; align-items: center; gap: 9px; padding: 9px 10px; background: #f8faff; border-radius: 12px; margin-bottom: 7px; border-left: 4px solid #c8d3e8; }
    .event-item.gcal-event { background: #f0f7ff; }
    .event-body { flex: 1; min-width: 0; }
    .event-title { font-size: 14px; font-weight: 800; color: #2d3748; display: flex; align-items: center; gap: 5px; }
    .event-meta  { font-size: 11px; color: #a0aec0; font-weight: 600; margin-top: 1px; }
    .event-person-chip { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 12px; background: #f0f4ff; color: #6a11cb; flex-shrink: 0; }
    .g-badge { font-size: 10px; font-weight: 900; background: #4285f4; color: white; border-radius: 4px; padding: 1px 4px; letter-spacing: 0.2px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #c8d3e8; border-radius: 4px; }
  </style>
</head>
<body>

<!-- ════════════════ LOGIN ════════════════ -->
<div id="loginScreen">
  <div class="login-logo">🏠</div>
  <div class="login-title">FamilyHub</div>
  <div class="login-sub">Who's there?</div>
  <div class="login-grid">
    <div class="login-card" onclick="login('Zohar')"><div class="login-card-emoji">👩</div><div class="login-card-name">Zohar</div><div class="login-card-role">Mom</div></div>
    <div class="login-card" onclick="login('Nir')"><div class="login-card-emoji">👨</div><div class="login-card-name">Nir</div><div class="login-card-role">Dad</div></div>
    <div class="login-card" onclick="login('Roni')"><div class="login-card-emoji">👧</div><div class="login-card-name">Roni</div><div class="login-card-role">Age 12</div></div>
    <div class="login-card" onclick="login('Shira')"><div class="login-card-emoji">🧒</div><div class="login-card-name">Shira</div><div class="login-card-role">Age 9</div></div>
    <div class="login-card" onclick="login('Noya')"><div class="login-card-emoji">👶</div><div class="login-card-name">Noya</div><div class="login-card-role">Age 5</div></div>
  </div>
</div>

<!-- ════════════════ APP ════════════════ -->
<div id="app">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="header-title">🏠 FamilyHub</div>
        <div class="header-greeting" id="headerGreeting"></div>
      </div>
      <button class="switch-btn" onclick="switchUser()">Switch user</button>
    </div>
    <div class="header-date" id="headerDate"></div>
    <div class="avatar-row" id="avatarRow"></div>
  </div>

  <div class="tab-bar">
    <div class="tab active"  onclick="switchTab('home')">    <span class="tab-icon">🏡</span>Home</div>
    <div class="tab"         onclick="switchTab('chores')">  <span class="tab-icon">✅</span>Chores</div>
    <div class="tab"         onclick="switchTab('grocery')"> <span class="tab-icon">🛒</span>Grocery</div>
    <div class="tab"         onclick="switchTab('homework')"><span class="tab-icon">📚</span>Homework</div>
    <div class="tab"         onclick="switchTab('calendar')"><span class="tab-icon">📅</span>Calendar</div>
  </div>

  <div class="content">

    <!-- HOME -->
    <div id="tab-home" class="tab-content active">
      <div id="welcomeBanner"></div>
      <div class="card"><div class="card-title" id="homeChoresTitle">⚡ Today's Chores</div><div id="homeTasks"></div></div>
      <div class="card"><div class="card-title">⭐ Star Chart</div><div class="star-chart" id="starChart"></div></div>
      <div class="card"><div class="card-title">📋 Homework Due Soon</div><div id="hwSummary"></div></div>
    </div>

    <!-- CHORES -->
    <div id="tab-chores" class="tab-content">
      <div id="choresContent"></div>
      <div class="card" id="addChoreCard">
        <div class="card-title">➕ Add Chore</div>
        <div class="add-form">
          <input class="add-input" id="newChoreText" type="text" placeholder="What needs doing…" onkeydown="if(event.key==='Enter')addChore()">
          <div class="form-row">
            <select id="newChoreAssignee" style="flex:1">
              <option value="Zohar">👩 Zohar</option><option value="Nir">👨 Nir</option>
              <option value="Roni">👧 Roni</option><option value="Shira">🧒 Shira</option><option value="Noya">👶 Noya</option>
            </select>
            <select id="newChorePriority" style="flex:1">
              <option value="high">🔴 High</option><option value="medium">🟡 Medium</option><option value="low">🟢 Low</option>
            </select>
            <button class="btn-sm" onclick="addChore()">Add</button>
          </div>
        </div>
      </div>
    </div>

    <!-- GROCERY -->
    <div id="tab-grocery" class="tab-content">
      <div class="card">
        <div class="card-title">🛒 Shopping List</div>
        <div class="grocery-add" id="groceryAddForm">
          <input class="g-input" id="groceryItem" type="text" placeholder="Add item…" onkeydown="if(event.key==='Enter')addGrocery()">
          <select class="g-cat" id="groceryCat">
            <option value="Fruit &amp; Veg">🥦 Fruit &amp; Veg</option>
            <option value="Dairy &amp; Eggs">🥛 Dairy &amp; Eggs</option>
            <option value="Pantry">🥫 Pantry</option>
            <option value="Meat &amp; Fish">🥩 Meat &amp; Fish</option>
          </select>
          <button class="btn" onclick="addGrocery()">＋</button>
        </div>
        <div id="groceryList"></div>
        <button class="btn-ghost" id="groceryClearBtn" onclick="clearChecked()">🗑 Clear checked</button>
      </div>
    </div>

    <!-- HOMEWORK -->
    <div id="tab-homework" class="tab-content">
      <div class="child-tabs" id="childTabs">
        <div class="child-tab active" onclick="switchChild('Roni')">👧 Roni</div>
        <div class="child-tab"        onclick="switchChild('Shira')">🧒 Shira</div>
        <div class="child-tab"        onclick="switchChild('Noya')">👶 Noya</div>
      </div>
      <div class="card">
        <div class="card-title" id="hwCardTitle">📖 Roni's Homework</div>
        <div id="hwList"></div>
        <div class="add-form" id="addHwForm">
          <input class="add-input" id="hwDesc" type="text" placeholder="Assignment description…">
          <div class="form-row">
            <select id="hwSubject" style="flex:1">
              <option value="Maths">📐 Maths</option><option value="English">📝 English</option>
              <option value="Science">🔬 Science</option><option value="History">🏛 History</option><option value="Art">🎨 Art</option>
            </select>
            <input type="date" id="hwDue" style="flex:1">

// ════════════════════════════════════════
//  GOOGLE API INIT
// ════════════════════════════════════════
function gapiLoaded() {
  gapi.load('client', async () => {
    await gapi.client.init({ discoveryDocs: [GCAL_DISCOVERY] });
    gcal.gapiReady = true;
    renderGCalBar();
  });
}

function gisLoaded() {
  if (GOOGLE_CLIENT_ID.includes('YOUR_CLIENT_ID')) {
    gcal.gisReady = true;
    renderGCalBar();
    return;
  }
  gcal.tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: GCAL_SCOPE,
    callback: onGCalToken,
  });
  gcal.gisReady = true;
  renderGCalBar();
}

async function onGCalToken(resp) {
  if (resp.error) { console.error('GCal auth error', resp); return; }
  gcal.accessToken = resp.access_token;
  await fetchGCalEvents();
  renderGCalBar();
}

async function fetchGCalEvents() {
  if (!gcalConnected()) return;
  gcal.syncing = true;
  renderGCalBar();
  try {
    const timeMin = new Date(_now.getTime() - 30*864e5).toISOString();
    const timeMax = new Date(_now.getTime() + 90*864e5).toISOString();
    const res = await gapi.client.calendar.events.list({
      calendarId: 'primary',
      timeMin, timeMax,
      maxResults: 250,
      singleEvents: true,
      orderBy: 'startTime',
    });
    gcal.events = (res.result.items || []).map(ev => ({
      id:     'gcal_' + ev.id,
      gcalId: ev.id,
      title:  ev.summary || '(No title)',
      date:   (ev.start.dateTime || ev.start.date).slice(0,10),
      time:   ev.start.dateTime ? ev.start.dateTime.slice(11,16) : '',
      person: 'All',
      gcal:   true,
    }));
  } catch(e) {
    console.error('fetchGCalEvents error', e);
  }
  gcal.syncing = false;
  renderGCalBar();
  renderCalendar();
}

function connectGCal() {
  if (!gcalReady() || !gcal.tokenClient) return;
  gcal.tokenClient.requestAccessToken({prompt: ''});
}

function disconnectGCal() {
  if (gcal.accessToken) {
    google.accounts.oauth2.revoke(gcal.accessToken, () => {});
    gcal.accessToken = null;
  }
  gcal.events = [];
  renderGCalBar();
  renderCalendar();
}

function renderGCalBar() {
  const statusEl = document.getElementById('gcalStatus');
  const btnsEl   = document.getElementById('gcalBtns');
  if (!statusEl) return;

  if (GOOGLE_CLIENT_ID.includes('YOUR_CLIENT_ID')) {
    statusEl.innerHTML = '<span class="needs-setup">⚠ Paste your Client ID in the script to enable sync</span>';
    btnsEl.innerHTML   = '';
    return;
  }
  if (!gcalReady()) {
    statusEl.textContent = 'Loading Google APIs…';
    btnsEl.innerHTML = '';
    return;
  }
  if (gcal.syncing) {
    statusEl.innerHTML = '🔄 Syncing…';
    btnsEl.innerHTML = '';
    return;
  }
  if (gcalConnected()) {
    statusEl.innerHTML = '<span class="connected">✓ Google Calendar connected</span>';
    btnsEl.innerHTML = `
      <button class="gcal-btn gcal-btn-refresh" onclick="fetchGCalEvents()">↻</button>
      <button class="gcal-btn gcal-btn-disconnect" onclick="disconnectGCal()">Disconnect</button>`;
  } else {
    statusEl.textContent = 'Sync with Google Calendar';
    btnsEl.innerHTML = `<button class="gcal-btn gcal-btn-connect" onclick="connectGCal()">Connect</button>`;
  }
}

// Create event in Google Calendar and return the gcalId
async function gcalCreateEvent(ev) {
  if (!gcalConnected() || !isParent()) return null;
  const tz    = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const body  = {
    summary: ev.title,
    start: ev.time
      ? {dateTime: `${ev.date}T${ev.time}:00`, timeZone: tz}
      : {date: ev.date},
    end: ev.time
      ? {dateTime: `${ev.date}T${pad2(parseInt(ev.time)+1)}:${ev.time.slice(3)}:00`, timeZone: tz}
      : {date: ev.date},
  };
  try {
    const res = await gapi.client.calendar.events.insert({calendarId:'primary', resource:body});
    return res.result.id;
  } catch(e) { console.error('gcalCreateEvent', e); return null; }
}

async function gcalDeleteEvent(gcalId) {
  if (!gcalConnected() || !isParent() || !gcalId) return;
  try {
    await gapi.client.calendar.events.delete({calendarId:'primary', eventId: gcalId});
  } catch(e) { console.error('gcalDeleteEvent', e); }
}

function pad2(n) { return String(n % 24).padStart(2,'0'); }

// ════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════
function fmtDate(str) {
  if (!str) return '';
  return new Date(str+'T00:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function fmtDateLong(str) {
  if (!str) return '';
  return new Date(str+'T00:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

  document.getElementById('groceryItem').value=''; save(); renderGrocery();
}
function toggleGrocery(id) {
  if (!isParent()) return;
  const g=S.grocery.find(x=>x.id===id); if (g){g.checked=!g.checked; save(); renderGrocery();}
}
function deleteGrocery(id) {
  if (!isParent()) return;
  S.grocery=S.grocery.filter(x=>x.id!==id); save(); renderGrocery();
}
function clearChecked() {
  if (!isParent()) return;
  S.grocery=S.grocery.filter(g=>!g.checked); save(); renderGrocery();
}

function renderHomework() {
  document.getElementById('hwCardTitle').textContent = `📖 ${S.child}'s Homework`;
  document.querySelectorAll('.child-tab').forEach(el =>
    el.classList.toggle('active', el.textContent.trim().includes(S.child)));
  const canAdd = isParent()||S.child===S.user;
  document.getElementById('addHwForm').style.display = canAdd ? '' : 'none';
  const items = S.homework.filter(h => h.child===S.child);
  document.getElementById('hwList').innerHTML = items.length
    ? items.map(h => {
        const can = isParent()||h.child===S.user;
        return `<div class="hw-item">
          <div class="hw-head">
            <div class="check-box ${h.done?'done':''} ${can?'':'readonly'}" ${can?`onclick="toggleHW(${h.id})"`:''}>
              ${h.done?'✓':''}</div>
            <span class="badge b-${esc(h.subject)}">${esc(h.subject)}</span>
            <div class="hw-desc-text ${h.done?'done':''}">${esc(h.desc)}</div>
            ${isParent()?`<button class="del-btn" onclick="deleteHW(${h.id})">×</button>`:''}</div>
          ${h.due?`<div class="hw-due">📅 Due: ${fmtDate(h.due)}</div>`:''}</div>`;
      }).join('')
    : '<div class="empty">No homework! 🎉</div>';
}
function switchChild(c){S.child=c;renderHomework();}
function toggleHW(id) {
  const h=S.homework.find(x=>x.id===id);
  if (!h||(!isParent()&&h.child!==S.user)) return;
  h.done=!h.done; save(); renderHomework(); renderHome();
}
function deleteHW(id) {
  if (!isParent()) return;
  S.homework=S.homework.filter(x=>x.id!==id); save(); renderHomework(); renderHome();
}
function addHomework() {
  const desc=document.getElementById('hwDesc').value.trim();
  if (!desc||(!isParent()&&S.child!==S.user)) return;
  S.homework.push({id:Date.now(),child:S.child,subject:document.getElementById('hwSubject').value,desc,due:document.getElementById('hwDue').value,done:false});
  document.getElementById('hwDesc').value=''; save(); renderHomework(); renderHome();
}

// ════════════════════════════════════════
//  CALENDAR
// ════════════════════════════════════════
function allCalEvents() {
  // Merge local + GCal events; local events that were synced to GCal
  // have a gcalId — skip them from the local list to avoid duplicates.
  const syncedIds = new Set(S.events.filter(e=>e.gcalId).map(e=>e.gcalId));
  const localOnly = S.events.filter(e => !e.gcalId);
  // GCal events that are NOT already represented as local events
  const gcalOnly  = gcal.events.filter(e => !syncedIds.has(e.gcalId));
  // Also include local events that have gcalId (they exist on both sides — show them once)
  const synced    = S.events.filter(e => e.gcalId);
  return [...localOnly, ...synced, ...gcalOnly];
}

function renderCalendar() {
  const yr=S.calYear, mo=S.calMonth;
  document.getElementById('calMonthLabel').textContent = `${MONTHS[mo]} ${yr}`;
  const di = document.getElementById('newEventDate');
  if (di && !di.value) di.value = S.calSelected;

  const events = allCalEvents();
  const dotMap  = {};
  events.forEach(ev => { if (!dotMap[ev.date]) dotMap[ev.date]=[]; dotMap[ev.date].push(ev.gcal ? '#4285f4' : (PERSON_COLOR[ev.person]||'#a0aec0')); });

  let html = DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const firstDay   = new Date(yr,mo,1).getDay();
  const daysInMo   = new Date(yr,mo+1,0).getDate();
  const daysInPrev = new Date(yr,mo,0).getDate();
  for (let i=firstDay-1;i>=0;i--) {
    const d=daysInPrev-i;
    html += dayCell(`${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`,d,true,dotMap);
  }
  for (let d=1;d<=daysInMo;d++) {
    html += dayCell(`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,d,false,dotMap);
  }
  const filled=firstDay+daysInMo, rem=filled%7===0?0:7-(filled%7);
  for (let d=1;d<=rem;d++) {
    html += dayCell(`${yr}-${String(mo+2).padStart(2,'0')}-${String(d).padStart(2,'0')}`,d,true,dotMap);
  }
  document.getElementById('calGrid').innerHTML = html;
  renderDayPanel(events);
}

function dayCell(dateStr,num,other,dotMap) {
  const isTod=dateStr===today, isSel=dateStr===S.calSelected;
  const dots=(dotMap[dateStr]||[]).slice(0,5);
  const cls=['cal-day',other?'other-month':'',isTod?'today':'',isSel?'selected':''].filter(Boolean).join(' ');
  return `<div class="${cls}" onclick="selectDay('${dateStr}')">
    <span class="cal-day-num">${num}</span>
    <div class="cal-dots">${dots.map(c=>`<span class="cal-dot" style="background:${c}"></span>`).join('')}</div>
  </div>`;
}

function selectDay(dateStr) {
  S.calSelected=dateStr;
  const di=document.getElementById('newEventDate'); if (di) di.value=dateStr;
  renderCalendar();
}

function renderDayPanel(events) {
  const evs=(events||allCalEvents())
    .filter(e=>e.date===S.calSelected)
    .sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const title = S.calSelected===today ? 'Today' : fmtDateLong(S.calSelected);
  let html = `<div class="day-panel-title">📆 ${title}</div>`;
  if (!evs.length) {
    html += '<div class="empty" style="padding:12px">No events</div>';
  } else {
    html += evs.map(e => {
      const color = e.gcal ? '#4285f4' : (PERSON_COLOR[e.person]||'#a0aec0');
      const personLabel = e.gcal ? '' :
        (e.person==='All'?'👨‍👩‍👧‍👧 All':(EMOJI[e.person]||'')+' '+e.person);
      const canDel = isParent() && (!e.gcal || gcalConnected());
      return `<div class="event-item ${e.gcal?'gcal-event':''}" style="border-left-color:${color}">
        <div class="event-body">
          <div class="event-title">
            ${e.gcal?'<span class="g-badge">G</span>':''}
            ${esc(e.title)}
          </div>
          <div class="event-meta">${e.time?'🕐 '+e.time:'All day'}${e.gcal?' · Google Calendar':''}</div>
        </div>
        ${personLabel?`<span class="event-person-chip" style="background:${color}22;color:${color}">${personLabel}</span>`:''}
        ${canDel?`<button class="del-btn" onclick="deleteEvent(${e.id},'${e.gcalId||''}')">×</button>`:''}
      </div>`;
    }).join('');
  }
  document.getElementById('dayPanel').innerHTML = html;
}

function calShift(d) {
  S.calMonth+=d;
  if (S.calMonth>11){S.calMonth=0;S.calYear++;}
  if (S.calMonth<0) {S.calMonth=11;S.calYear--;}
  renderCalendar();
}

async function addEvent() {
  if (!isParent()) return;
  const title=document.getElementById('newEventTitle').value.trim();
  const date =document.getElementById('newEventDate').value;
  if (!title||!date) return;

  const ev = {
    id:     Date.now(),
    title,  date,
    time:   document.getElementById('newEventTime').value,
    person: document.getElementById('newEventPerson').value,
  };

  // Push to Google Calendar if connected, store gcalId
  if (gcalConnected()) {
    const gcalId = await gcalCreateEvent(ev);
    if (gcalId) ev.gcalId = gcalId;
  }

  S.events.push(ev);
  document.getElementById('newEventTitle').value='';
  document.getElementById('newEventTime').value='';
  S.calSelected=date;
  const d2=new Date(date+'T00:00:00');
  S.calYear=d2.getFullYear(); S.calMonth=d2.getMonth();
  save();
  if (gcalConnected()) await fetchGCalEvents(); else renderCalendar();
}

async function deleteEvent(id, gcalId) {
  if (!isParent()) return;
  // Delete from Google Calendar if it's a GCal event or a synced local event
  if (gcalId && gcalConnected()) await gcalDeleteEvent(gcalId);
  // Remove from local events (numeric id) — gcal-only events have string ids like 'gcal_xxx'
  if (typeof id === 'number') S.events = S.events.filter(x => x.id !== id);
  save();
  if (gcalConnected()) await fetchGCalEvents(); else renderCalendar();
}
