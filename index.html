<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyHub 🏠</title>
  <link id="favicon" rel="icon" type="image/png">
  <script>
    (function(){
      const c=document.createElement('canvas');c.width=c.height=64;
      const x=c.getContext('2d');
      // Purple gradient background
      const g=x.createLinearGradient(0,0,64,64);
      g.addColorStop(0,'#6a11cb');g.addColorStop(1,'#f5576c');
      x.fillStyle=g;x.beginPath();
      x.roundRect(0,0,64,64,14);x.fill();
      // House emoji
      x.font='38px serif';x.textAlign='center';x.textBaseline='middle';
      x.fillText('🏠',32,34);
      document.getElementById('favicon').href=c.toDataURL();
    })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Firebase SDKs — must load before main script -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { font-family: 'Heebo', 'Nunito', sans-serif; }
    :root[lang="en"] { font-family: 'Nunito', 'Heebo', sans-serif; }
    body { background: #f0f4ff; min-height: 100vh; max-width: 520px; margin: 0 auto; padding-bottom: 32px; }

    /* ── Loading ─────────────────────────────── */
    #loadingScreen { position:fixed;inset:0;background:linear-gradient(160deg,#6a11cb 0%,#c471ed 50%,#f5576c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1000; }
    #loadingScreen.hidden { display:none; }
    .loading-emoji { font-size:52px;animation:bounce 1.8s infinite; }
    .loading-txt { font-size:15px;color:rgba(255,255,255,0.8);font-weight:700;margin-top:12px; }

    /* ── Auth Screen ─────────────────────────── */
    #authScreen { position:fixed;inset:0;background:linear-gradient(160deg,#6a11cb 0%,#c471ed 50%,#f5576c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:20px;overflow-y:auto; }
    #authScreen.hidden { display:none; }
    .auth-card { background:white;border-radius:24px;padding:24px 22px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,0.25); }
    .auth-logo { font-size:40px;text-align:center;margin-bottom:2px; }
    .auth-title { font-size:24px;font-weight:900;text-align:center;color:#1a202c;margin-bottom:18px; }
    .auth-tabs { display:flex;background:#f0f4ff;border-radius:14px;padding:3px;gap:3px;margin-bottom:20px; }
    .auth-tab { flex:1;padding:9px;text-align:center;font-size:14px;font-weight:800;color:#718096;cursor:pointer;border-radius:11px;transition:all 0.2s;user-select:none; }
    .auth-tab.active { background:white;color:#6a11cb;box-shadow:0 2px 8px rgba(0,0,0,0.1); }
    .auth-input { width:100%;padding:11px 14px;border:2px solid #e8edf5;border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;outline:none;margin-bottom:10px;display:block;box-sizing:border-box;color:#1a202c; }
    .auth-input:focus { border-color:#6a11cb; }
    .auth-error { color:#e53e3e;font-size:13px;font-weight:700;margin-bottom:6px;min-height:16px; }
    .auth-btn-main { width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(135deg,#6a11cb,#f093fb);color:white;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;margin-top:4px;transition:opacity 0.18s; }
    .auth-btn-main:hover { opacity:0.9; }
    .auth-loading { text-align:center;padding:14px;color:#6a11cb;font-size:14px;font-weight:700; }
    .auth-panel-label { font-size:13px;font-weight:800;color:#4a5568;margin-bottom:10px; }
    .emoji-row { display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px; }
    .emoji-opt { font-size:22px;padding:5px 7px;border-radius:10px;cursor:pointer;border:2px solid transparent;transition:all 0.15s;line-height:1; }
    .emoji-opt:hover { background:#f0f4ff; }
    .emoji-opt.selected { border-color:#6a11cb;background:#f0f4ff; }
    .mb-add-row { display:flex;gap:8px;margin-bottom:10px;align-items:center; }
    .mb-name-input { margin-bottom:0 !important;flex:1; }
    .mb-role-toggle { display:flex;background:#f0f4ff;border-radius:10px;overflow:hidden;flex-shrink:0; }
    .mb-role-btn { padding:8px 10px;border:none;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;background:transparent;color:#718096;transition:all 0.15s; }
    .mb-role-btn.active { background:#6a11cb;color:white; }
    .auth-btn-add { width:100%;padding:9px;border:none;border-radius:10px;background:#f0f4ff;color:#6a11cb;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:12px;transition:background 0.15s; }
    .auth-btn-add:hover { background:#e0e8ff; }
    .member-preview { display:flex;flex-direction:column;gap:6px;max-height:160px;overflow-y:auto;margin-bottom:8px; }
    .member-chip { display:flex;align-items:center;gap:8px;background:#f8faff;border-radius:10px;padding:8px 10px; }
    .member-chip-emoji { font-size:20px;flex-shrink:0; }
    .member-chip-name { flex:1;font-size:14px;font-weight:800;color:#1a202c; }
    .member-chip-role { font-size:11px;color:#718096;font-weight:700;flex-shrink:0; }
    .member-chip-del { background:none;border:none;color:#e53e3e;cursor:pointer;font-size:16px;opacity:0.45;flex-shrink:0;line-height:1;padding:0 2px; }
    .member-chip-del:hover { opacity:1; }
    .auth-btns-row { display:flex;align-items:center;justify-content:space-between;margin-top:8px; }
    .auth-btn-back { background:none;border:none;color:#6a11cb;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;padding:0; }
    .auth-btn-create { width:auto !important;padding:10px 20px !important; }

    /* ── Login (member picker) ───────────────── */
    #loginScreen { position:fixed;inset:0;background:linear-gradient(160deg,#6a11cb 0%,#c471ed 50%,#f5576c 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:998;padding:24px; }
    #loginScreen.hidden { display:none; }
    .login-logo { font-size:52px;margin-bottom:8px;animation:bounce 1.8s infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .login-title { font-size:32px;font-weight:900;color:white;letter-spacing:-0.5px; }
    .login-family-name { font-size:14px;color:rgba(255,255,255,0.65);font-weight:700;margin-top:2px; }
    .login-sub { font-size:16px;color:rgba(255,255,255,0.75);font-weight:700;margin-top:6px;margin-bottom:28px; }
    .login-grid { display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:340px; }
    .login-card-solo { grid-column:1/-1;max-width:152px;margin:0 auto; }
    .login-card { background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.3);border-radius:22px;padding:20px 12px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:transform 0.18s,background 0.18s,box-shadow 0.18s;backdrop-filter:blur(6px); }
    .login-card:hover { transform:scale(1.06);background:rgba(255,255,255,0.28);box-shadow:0 8px 24px rgba(0,0,0,0.2); }
    .login-card-emoji { width:62px;height:62px;background:rgba(255,255,255,0.25);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;border:2px solid rgba(255,255,255,0.5); }
    .login-card-name { font-size:15px;font-weight:900;color:white; }
    .login-card-role { font-size:11px;color:rgba(255,255,255,0.65);font-weight:700; }
    .login-signout { background:rgba(255,255,255,0.1);border:1.5px solid rgba(255,255,255,0.25);border-radius:20px;color:rgba(255,255,255,0.6);font-family:inherit;font-size:12px;font-weight:800;padding:7px 18px;cursor:pointer;margin-top:18px;transition:background 0.18s; }
    .login-signout:hover { background:rgba(255,255,255,0.2);color:white; }

    /* ── App ─────────────────────────────────── */
    #app { display:none; }
    #app.visible { display:block; }

    /* Header */
    .header { background:linear-gradient(135deg,#6a11cb 0%,#f093fb 55%,#f5576c 100%);padding:16px 16px 14px;color:white; }
    .header-top { display:flex;align-items:center;justify-content:space-between;margin-bottom:2px; }
    .header-title { font-size:22px;font-weight:900;letter-spacing:-0.5px; }
    .header-greeting { font-size:18px;font-weight:900; }
    .header-btns { display:flex;gap:8px;align-items:center;flex-shrink:0; }
    .switch-btn,.lang-btn { background:rgba(255,255,255,0.2);border:1.5px solid rgba(255,255,255,0.45);border-radius:20px;color:white;font-family:inherit;font-size:11px;font-weight:800;padding:5px 12px;cursor:pointer;transition:background 0.18s;white-space:nowrap; }
    .switch-btn:hover,.lang-btn:hover { background:rgba(255,255,255,0.32); }
    .header-date { font-size:12px;opacity:0.8;font-weight:600;margin-bottom:14px; }
    .avatar-row { display:flex;gap:10px;overflow-x:auto;padding-bottom:2px; }
    .avatar-row::-webkit-scrollbar { display:none; }
    .avatar-chip { display:flex;flex-direction:column;align-items:center;cursor:pointer;flex-shrink:0;transition:transform 0.15s; }
    .avatar-chip:active { transform:scale(0.9); }
    .avatar-bubble { width:44px;height:44px;background:rgba(255,255,255,0.2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;border:2.5px solid rgba(255,255,255,0.35);transition:all 0.2s; }
    .avatar-chip.active .avatar-bubble { background:white;border-color:white;box-shadow:0 0 0 3px rgba(255,255,255,0.4); }
    .avatar-label { font-size:10px;font-weight:800;margin-top:4px;opacity:0.9; }

    /* Tab bar */
    .tab-bar { display:flex;background:white;border-bottom:2px solid #e8edf5;position:sticky;top:0;z-index:100;box-shadow:0 3px 10px rgba(0,0,0,0.08);overflow-x:auto; }
    .tab-bar::-webkit-scrollbar { display:none; }
    .tab { flex:0 0 auto;min-width:72px;padding:11px 10px 9px;text-align:center;font-size:11px;font-weight:800;color:#9aa5b8;cursor:pointer;border-bottom:3px solid transparent;transition:all 0.2s;user-select:none;white-space:nowrap; }
    .tab.active { color:#6a11cb;border-bottom-color:#6a11cb; }
    .tab-icon { font-size:19px;display:block;margin-bottom:2px; }

    /* Content / Cards */
    .content { padding:14px; }
    .tab-content { display:none; }
    .tab-content.active { display:block; }
    .card { background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 14px rgba(0,0,0,0.06); }
    .card-title { font-size:16px;font-weight:900;color:#1a202c;margin-bottom:12px;display:flex;align-items:center;gap:6px; }
    .welcome-banner { border-radius:18px;padding:18px 16px;margin-bottom:14px;color:white;font-weight:800; }
    .wb-emoji { font-size:36px; }
    .wb-name  { font-size:22px;font-weight:900; }
    .wb-sub   { font-size:12px;opacity:0.85;margin-top:2px; }

    /* Task rows */
    .task-row { display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f3f6ff; }
    .task-row:last-of-type { border-bottom:none;padding-bottom:0; }
    .task-row:first-of-type { padding-top:0; }
    .check-box { width:24px;height:24px;border-radius:7px;border:2px solid #c8d3e8;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;transition:all 0.18s; }
    .check-box.done { background:linear-gradient(135deg,#6a11cb,#f093fb);border-color:transparent;color:white; }
    .check-box.readonly { cursor:default; }
    .task-text { flex:1;font-size:14px;font-weight:700;color:#2d3748; }
    .task-text.done { text-decoration:line-through;color:#a0aec0; }
    .mini-avatar { font-size:18px;width:30px;height:30px;background:#f3f6ff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0; }
    .del-btn { background:none;border:none;font-size:17px;cursor:pointer;opacity:0.35;line-height:1;padding:0 3px;transition:opacity 0.15s; }
    .del-btn:hover { opacity:0.7; }
    .pri { font-size:9px;font-weight:900;padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:0.3px;flex-shrink:0; }
    .pri-high   { background:#fff0f0;color:#e53e3e; }
    .pri-medium { background:#fffbeb;color:#c87b00; }
    .pri-low    { background:#f0fff4;color:#38a169; }

    /* Stars */
    .star-chart { display:flex;flex-direction:column;gap:14px; }
    .star-row { display:flex;align-items:center;gap:10px; }
    .star-person { display:flex;align-items:center;gap:6px;min-width:80px; }
    .star-person-emoji { font-size:20px; }
    .star-person-name { font-size:13px;font-weight:800;color:#2d3748; }
    .stars { display:flex;gap:3px; }
    .star { font-size:24px;cursor:pointer;transition:transform 0.15s;filter:grayscale(1) opacity(0.25);line-height:1; }
    .star.on { filter:none; }
    .star:hover { transform:scale(1.25); }
    .star.readonly { cursor:default; }
    .star.readonly:hover { transform:none; }
    .star-count { font-size:11px;color:#a0aec0;font-weight:800;margin-inline-start:3px; }
    .star-row.mine { background:#fefce8;border-radius:12px;padding:6px 10px;margin:0 -10px; }

    /* Subject badges */
    .badge { font-size:10px;font-weight:900;padding:3px 9px;border-radius:20px;flex-shrink:0; }
    .b-Maths   { background:#ebf4ff;color:#2b6cb0; }
    .b-English { background:#f0fff4;color:#276749; }
    .b-Science { background:#faf5ff;color:#6b46c1; }
    .b-History { background:#fffaf0;color:#c05621; }
    .b-Art     { background:#fff5f7;color:#b83280; }

    /* Homework */
    .hw-item { padding:10px 0;border-bottom:1px solid #f3f6ff; }
    .hw-item:last-child { border-bottom:none; }
    .hw-head { display:flex;align-items:center;gap:7px; }
    .hw-desc-text { flex:1;font-size:13px;font-weight:700;color:#2d3748; }
    .hw-desc-text.done { text-decoration:line-through;color:#a0aec0; }
    .hw-due { font-size:11px;color:#a0aec0;font-weight:600;margin-top:4px;margin-inline-start:31px; }

    /* Grocery */
    .grocery-add { display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap; }
    .g-input { flex:1;min-width:120px;padding:9px 13px;border:2px solid #e8edf5;border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;outline:none; }
    .g-input:focus { border-color:#6a11cb; }
    .g-cat { padding:9px 8px;border:2px solid #e8edf5;border-radius:12px;font-family:inherit;font-size:12px;font-weight:700;outline:none;background:white;cursor:pointer; }
    .g-item { display:flex;align-items:center;gap:9px;padding:8px 10px;background:#f8faff;border-radius:11px;margin-bottom:6px; }
    .g-item-text { flex:1;font-size:14px;font-weight:700;color:#2d3748; }
    .g-item-text.done { text-decoration:line-through;color:#a0aec0; }
    .cat-title { font-size:11px;font-weight:900;color:#8896ab;text-transform:uppercase;letter-spacing:0.6px;margin:10px 0 7px; }
    .cat-title:first-child { margin-top:0; }

    /* Buttons */
    .btn { padding:9px 16px;border:none;border-radius:12px;background:linear-gradient(135deg,#6a11cb,#f093fb);color:white;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;transition:opacity 0.18s,transform 0.12s;flex-shrink:0; }
    .btn:active { opacity:0.8;transform:scale(0.96); }
    .btn-sm { padding:8px 14px;border:none;border-radius:10px;background:linear-gradient(135deg,#6a11cb,#f093fb);color:white;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;flex-shrink:0; }
    .btn-ghost { padding:6px 12px;border:none;border-radius:9px;background:#f0f4ff;color:#718096;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;display:block;margin-top:10px;margin-inline-start:auto; }
    .btn-ghost:hover { background:#e2e8f0; }

    /* Forms */
    .add-form { margin-top:12px;padding-top:12px;border-top:1.5px dashed #e8edf5;display:flex;flex-direction:column;gap:8px; }
    .form-row { display:flex;gap:7px; }
    .add-input { flex:1;padding:9px 12px;border:2px solid #e8edf5;border-radius:11px;font-family:inherit;font-size:14px;font-weight:700;outline:none; }
    .add-input:focus { border-color:#6a11cb; }
    select { padding:9px 8px;border:2px solid #e8edf5;border-radius:11px;font-family:inherit;font-size:13px;font-weight:700;outline:none;background:white;cursor:pointer; }
    select:focus { border-color:#6a11cb; }
    input[type="date"],input[type="time"] { padding:9px 8px;border:2px solid #e8edf5;border-radius:11px;font-family:inherit;font-size:13px;font-weight:700;outline:none;background:white; }
    input[type="date"]:focus,input[type="time"]:focus { border-color:#6a11cb; }

    /* Child tabs */
    .child-tabs { display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap; }
    .child-tab { padding:7px 16px;border-radius:22px;background:#f0f4ff;font-size:13px;font-weight:800;color:#718096;cursor:pointer;transition:all 0.2s;user-select:none; }
    .child-tab.active { background:linear-gradient(135deg,#6a11cb,#f093fb);color:white; }
    .person-header { font-size:15px;font-weight:900;color:#1a202c;margin-bottom:8px;display:flex;align-items:center;gap:7px; }
    .card.mine-card { border:2px solid #c471ed; }
    .empty { text-align:center;padding:22px;color:#a0aec0;font-size:14px;font-weight:700; }

    /* Calendar */
    .gcal-bar { display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f8faff;border-radius:12px;margin-bottom:14px; }
    .gcal-status { flex:1;font-size:13px;font-weight:700;color:#4a5568; }
    .gcal-status .connected { color:#38a169; }
    .gcal-status .needs-setup { color:#e53e3e;font-size:11px; }
    .gcal-btn { padding:7px 14px;border:none;border-radius:10px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap; }
    .gcal-btn-connect    { background:#4285f4;color:white; }
    .gcal-btn-disconnect { background:#f0f4ff;color:#718096; }
    .gcal-btn-refresh    { background:#f0f4ff;color:#4285f4;margin-inline-end:4px; }
    .cal-nav { display:flex;align-items:center;justify-content:space-between;margin-bottom:14px; }
    .cal-nav-btn { background:#f0f4ff;border:none;border-radius:10px;width:34px;height:34px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.18s;color:#6a11cb;font-weight:900; }
    .cal-nav-btn:hover { background:#e0e8ff; }
    .cal-month-label { font-size:18px;font-weight:900;color:#1a202c; }
    .cal-grid { display:grid;grid-template-columns:repeat(7,1fr);gap:3px; }
    .cal-dow { text-align:center;font-size:10px;font-weight:900;color:#a0aec0;text-transform:uppercase;padding:4px 0 6px; }
    .cal-day { aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;cursor:pointer;transition:background 0.15s; }
    .cal-day:hover { background:#f0f4ff; }
    .cal-day.other-month .cal-day-num { color:#d0d8e8; }
    .cal-day.today { background:#f0f4ff; }
    .cal-day.today .cal-day-num { color:#6a11cb;font-weight:900; }
    .cal-day.selected { background:linear-gradient(135deg,#6a11cb,#f093fb) !important; }
    .cal-day.selected .cal-day-num { color:white !important; }
    .cal-day-num { font-size:13px;font-weight:700;color:#2d3748;line-height:1; }
    .cal-dots { display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:3px;padding:0 2px; }
    .cal-dot { width:5px;height:5px;border-radius:50%;flex-shrink:0; }
    .cal-day.selected .cal-dot { opacity:0.85; }
    .day-panel { margin-top:14px; }
    .day-panel-title { font-size:15px;font-weight:900;color:#1a202c;margin-bottom:10px; }
    .event-item { display:flex;align-items:center;gap:9px;padding:9px 10px;background:#f8faff;border-radius:12px;margin-bottom:7px;border-inline-start:4px solid #c8d3e8; }
    .event-item.gcal-event { background:#f0f7ff; }
    .event-body { flex:1;min-width:0; }
    .event-title { font-size:14px;font-weight:800;color:#2d3748;display:flex;align-items:center;gap:5px; }
    .event-meta  { font-size:11px;color:#a0aec0;font-weight:600;margin-top:1px; }
    .event-person-chip { font-size:11px;font-weight:800;padding:2px 8px;border-radius:12px;background:#f0f4ff;color:#6a11cb;flex-shrink:0; }
    .g-badge { font-size:10px;font-weight:900;background:#4285f4;color:white;border-radius:4px;padding:1px 4px; }

    ::-webkit-scrollbar { width:4px;height:4px; }

function getLang() {
  if (!S || !S.uid || !S.user) return 'he';
  return localStorage.getItem('familyhub_lang_' + S.uid + '_' + S.user) || 'he';
}
function setLang(l) {
  if (!S.uid || !S.user) return;
  localStorage.setItem('familyhub_lang_' + S.uid + '_' + S.user, l);
  applyDir(); renderAll();
}
function toggleLang() { setLang(getLang() === 'he' ? 'en' : 'he'); }
function applyDir() {
  const l = getLang();
  document.documentElement.lang = l;
  document.documentElement.dir  = STRINGS[l].dir;
}
function t(key, ...args) {
  const s = STRINGS[getLang()] || STRINGS.he;
  const v = s[key] !== undefined ? s[key] : (STRINGS.he[key] || key);
  return typeof v === 'function' ? v(...args) : v;
}

// ════════════════════════════════════════

let familyData = null;

function getMembers()        { return familyData?.members || []; }
function getKids()           { return getMembers().filter(m => m.role === 'kid').map(m => m.name); }
function getParents()        { return getMembers().filter(m => m.role === 'parent').map(m => m.name); }
function getAllMemberNames()  { return getMembers().map(m => m.name); }
function getEmoji(name)      { return getMembers().find(m => m.name === name)?.emoji || '👤'; }

const COLOR_PALETTE  = ['#c471ed','#4facfe','#fa709a','#43e97b','#f9d423','#f5576c','#667eea','#48bb78'];
const KID_GRADIENTS  = ['#f093fb,#f5576c','#43e97b,#38f9d7','#fda085,#f6d365','#a18cd1,#fbc2eb','#667eea,#764ba2'];

function getPersonColor(name) {
  if (name === 'All') return '#a0aec0';
  const idx = getAllMemberNames().indexOf(name);
  return COLOR_PALETTE[Math.max(0, idx) % COLOR_PALETTE.length];
}
function getKidGradient(name) {
  const idx = getKids().indexOf(name);
  return KID_GRADIENTS[Math.max(0, idx) % KID_GRADIENTS.length];
}

let _mbRole = 'parent';
let _mbEmoji = EMOJI_OPTIONS[0];

function initEmojiRow() {
  el('emojiRow').innerHTML = EMOJI_OPTIONS.map(e =>
    `<span class="emoji-opt ${e===_mbEmoji?'selected':''}" onclick="selectMbEmoji('${e}',this)">${e}</span>`
  ).join('');
}
function selectMbEmoji(emoji, target) {
  _mbEmoji = emoji;
  document.querySelectorAll('.emoji-opt').forEach(e => e.classList.remove('selected'));
  target.classList.add('selected');
}
function setMbRole(role) {
  _mbRole = role;
  el('mbRoleParent').classList.toggle('active', role==='parent');
  el('mbRoleKid').classList.toggle('active', role==='kid');
}
function addDraftMember() {
  const name = el('mbName').value.trim();
  if (!name) { el('mbName').focus(); return; }
  _draftMembers.push({ name, emoji: _mbEmoji, role: _mbRole });
  el('mbName').value = '';
  renderMemberPreview();
}
function removeDraftMember(i) {
  _draftMembers.splice(i, 1);
  renderMemberPreview();
}
function renderMemberPreview() {
  el('memberPreview').innerHTML = _draftMembers.map((m, i) => `
    <div class="member-chip">
      <span class="member-chip-emoji">${m.emoji}</span>
      <span class="member-chip-name">${esc(m.name)}</span>
      <span class="member-chip-role">${m.role==='parent'?'הורה':'ילד/ה'}</span>
      <button class="member-chip-del" onclick="removeDraftMember(${i})">×</button>
    </div>`).join('');
}

function setAuthMode(mode) {
  el('signinPanel').style.display   = mode==='signin' ? '' : 'none';
  el('signupPanel1').style.display  = mode==='signup' ? '' : 'none';
  el('signupPanel2').style.display  = 'none';
  el('authTabSignin').classList.toggle('active', mode==='signin');
  el('authTabSignup').classList.toggle('active', mode==='signup');
  ['siError','su1Error','su2Error'].forEach(id => { const e=el(id); if(e) e.textContent=''; });
}

function signupNext() {
  const familyName = el('suFamily').value.trim();
  const email      = el('suEmail').value.trim();
  const pwd        = el('suPwd').value;
  el('su1Error').textContent = '';
  if (!familyName) { el('su1Error').textContent = 'נדרש שם משפחה'; return; }
  if (!email)      { el('su1Error').textContent = 'נדרש אימייל';   return; }
  if (pwd.length < 6) { el('su1Error').textContent = 'הסיסמה חייבת להיות לפחות 6 תווים'; return; }
  el('signupPanel1').style.display = 'none';
  el('signupPanel2').style.display = '';
  _draftMembers = [];
  renderMemberPreview();
  initEmojiRow();
}
function signupBack() {
  el('signupPanel2').style.display = 'none';
  el('signupPanel1').style.display = '';
}

async function doSignIn() {
  if (!FB_CONFIGURED) return;
  const email = el('siEmail').value.trim();
  const pwd   = el('siPwd').value;
  el('siError').textContent = '';
  if (!email || !pwd) { el('siError').textContent = 'נדרשים אימייל וסיסמה'; return; }
  setAuthLoading(true);
  try {
    await fbAuth.signInWithEmailAndPassword(email, pwd);
  } catch(e) {
    setAuthLoading(false);
    el('siError').textContent = getAuthError(e.code);
  }
}

async function doSignUp() {
  if (!FB_CONFIGURED) return;
  el('su2Error').textContent = '';
  const validMembers = _draftMembers.filter(m => m.name.trim());
  if (validMembers.length === 0) { el('su2Error').textContent = 'יש להוסיף לפחות איש משפחה אחד'; return; }
  const members = validMembers.map(m => ({ name:m.name.trim(), emoji:m.emoji, role:m.role }));
  const familyName = el('suFamily').value.trim();
  const email      = el('suEmail').value.trim();
  const pwd        = el('suPwd').value;
  setAuthLoading(true);
  try {
    const cred = await fbAuth.createUserWithEmailAndPassword(email, pwd);
    const uid  = cred.user.uid;
    // Migrate existing localStorage data if present
    const localRaw = localStorage.getItem('familyhub_v3');
    let init = { chores:[], grocery:[], homework:[], events:[], stars:{} };
    if (localRaw) { try { Object.assign(init, JSON.parse(localRaw)); } catch(e){} }
    await fbDb.collection('families').doc(uid).set({
      familyName, email, members,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      chores: init.chores||[], grocery: init.grocery||[],
      homework: init.homework||[], events: init.events||[], stars: init.stars||{},
    });
  } catch(e) {
    setAuthLoading(false);
    el('su2Error').textContent = getAuthError(e.code);
  }
}

function setAuthLoading(on) {
  el('authLoadingOverlay').style.display = on ? '' : 'none';
  ['signinPanel','signupPanel1','signupPanel2'].forEach(id => {
    const e = el(id); if (e) e.style.pointerEvents = on ? 'none' : '';
  });
}

function getAuthError(code) {
  const m = {
    'auth/user-not-found':         'לא נמצא חשבון עם אימייל זה',
    'auth/wrong-password':         'סיסמה שגויה',
    'auth/invalid-credential':     'אימייל או סיסמה שגויים',
    'auth/email-already-in-use':   'כתובת האימייל כבר בשימוש',
    'auth/invalid-email':          'כתובת אימייל לא תקינה',
    'auth/weak-password':          'הסיסמה חלשה מדי (6 תווים לפחות)',
    'auth/network-request-failed': 'בעיית חיבור לרשת',
    'auth/too-many-requests':      'יותר מדי ניסיונות, נסה שוב מאוחר יותר',
  };
  return m[code] || 'שגיאה: ' + code;
}

function authSignOut() {
  if (fbUnsubscribe) { fbUnsubscribe(); fbUnsubscribe = null; }
  S.user = null; S.uid = null; familyData = null;
  if (fbAuth) fbAuth.signOut();
  el('loginScreen').classList.add('hidden');
  el('app').classList.remove('visible');
  el('authScreen').classList.remove('hidden');
  setAuthMode('signin');
  setAuthLoading(false);
}

// ════════════════════════════════════════
//  FIRESTORE PERSISTENCE
// ════════════════════════════════════════
async function save() {
  if (!S.uid || !fbDb) return;
  try {
    await fbDb.collection('families').doc(S.uid).update({
      chores: S.chores, grocery: S.grocery, homework: S.homework,
      events: S.events, stars: S.stars,
    });
  } catch(e) { console.error('Save error:', e); }
}

function subscribeToFamily(uid) {
  if (fbUnsubscribe) { fbUnsubscribe(); fbUnsubscribe = null; }
  fbUnsubscribe = fbDb.collection('families').doc(uid).onSnapshot(snap => {
    if (!snap.exists) return;
    const d = snap.data();
    familyData = d;
    S.chores   = d.chores   || [];
    S.grocery  = d.grocery  || [];
    S.homework = d.homework || [];
    S.events   = d.events   || [];
    S.stars    = d.stars    || {};
    afterLoad();
  }, err => console.error('Firestore error:', err));
}

function afterLoad() {
  const kids = getKids();
  if (!S.child || !kids.includes(S.child)) S.child = kids[0] || null;
  el('loadingScreen').classList.add('hidden');
  if (S.user && getAllMemberNames().includes(S.user)) {
    renderAll();
  } else {
    const saved = localStorage.getItem('familyhub_member_' + S.uid);
    if (saved && getAllMemberNames().includes(saved)) {
      login(saved);
    } else {
      renderLoginScreen();
      el('loginScreen').classList.remove('hidden');
    }
  }
}

//  GOOGLE CALENDAR
// ════════════════════════════════════════
function gapiLoaded() {
  gapi.load('client', async () => {
    await gapi.client.init({discoveryDocs:[GCAL_DISCOVERY]});
    gcal.gapiReady=true; renderGCalBar();
  });
}
function gisLoaded() {
  if (!GOOGLE_CLIENT_ID.includes('YOUR_CLIENT_ID')) {
    gcal.tokenClient = google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID, scope:GCAL_SCOPE, callback:onGCalToken,
    });
  }
  gcal.gisReady=true; renderGCalBar();
}
async function onGCalToken(resp) {
  if (resp.error) return;
  gcal.accessToken=resp.access_token;
  await fetchGCalEvents(); renderGCalBar();
}
async function fetchGCalEvents() {
  if (!gcalConnected()) return;
  gcal.syncing=true; renderGCalBar();
  try {
    const res = await gapi.client.calendar.events.list({
      calendarId:'primary',
      timeMin:new Date(_now.getTime()-30*864e5).toISOString(),
      timeMax:new Date(_now.getTime()+90*864e5).toISOString(),
      maxResults:250,singleEvents:true,orderBy:'startTime',
    });
    gcal.events=(res.result.items||[]).map(ev=>({
      id:'gcal_'+ev.id, gcalId:ev.id,
      title:ev.summary||'(No title)',
      date:(ev.start.dateTime||ev.start.date).slice(0,10),
      time:ev.start.dateTime?ev.start.dateTime.slice(11,16):'',
      person:'All', gcal:true,
    }));
  } catch(e){console.error(e);}
  gcal.syncing=false; renderGCalBar(); renderCalendar();
}
function connectGCal()    { if (gcalReady()&&gcal.tokenClient) gcal.tokenClient.requestAccessToken({prompt:''}); }
function disconnectGCal() {
  if (gcal.accessToken) google.accounts.oauth2.revoke(gcal.accessToken,()=>{});
  gcal.accessToken=null; gcal.events=[];
  renderGCalBar(); renderCalendar();
}
function renderGCalBar() {
  const st=el('gcalStatus'); const bt=el('gcalBtns');
  if (!st) return;
  if (GOOGLE_CLIENT_ID.includes('YOUR_CLIENT_ID')) {
    st.innerHTML=`<span class="needs-setup">${t('gcalSetup')}</span>`; bt.innerHTML=''; return;
  }
  if (!gcalReady())   { st.textContent=t('gcalLoading'); bt.innerHTML=''; return; }
  if (gcal.syncing)   { st.textContent=t('gcalSyncing'); bt.innerHTML=''; return; }
  if (gcalConnected()) {
    st.innerHTML=`<span class="connected">${t('gcalConnected')}</span>`;
    bt.innerHTML=`<button class="gcal-btn gcal-btn-refresh" onclick="fetchGCalEvents()">${t('gcalRefresh')}</button>
                  <button class="gcal-btn gcal-btn-disconnect" onclick="disconnectGCal()">${t('gcalDisconnect')}</button>`;
  } else {
    st.textContent=t('gcalSync');
    bt.innerHTML=`<button class="gcal-btn gcal-btn-connect" onclick="connectGCal()">${t('gcalConnect')}</button>`;
  }
}
async function gcalCreateEvent(ev) {
  if (!gcalConnected()||!isParent()) return null;
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  try {
    const res=await gapi.client.calendar.events.insert({calendarId:'primary',resource:{
      summary:ev.title,
      start:ev.time?{dateTime:`${ev.date}T${ev.time}:00`,timeZone:tz}:{date:ev.date},
      end:ev.time?{dateTime:`${ev.date}T${String(parseInt(ev.time)+1).padStart(2,'0')}:${ev.time.slice(3)}:00`,timeZone:tz}:{date:ev.date},
    }});
    return res.result.id;
  } catch(e){console.error(e);return null;}
}
async function gcalDeleteEvent(gcalId) {
  if (!gcalConnected()||!gcalId) return;
  try { await gapi.client.calendar.events.delete({calendarId:'primary',eventId:gcalId}); } catch(e){}
}

function fmtDate(str) {
  if (!str) return '';
  return new Date(str+'T00:00:00').toLocaleDateString(t('locale'),{weekday:'short',month:'short',day:'numeric'});
}
function fmtDateLong(str) {
  if (!str) return '';
  return new Date(str+'T00:00:00').toLocaleDateString(t('locale'),{weekday:'long',month:'long',day:'numeric'});
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function el(id){ return document.getElementById(id); }

// ════════════════════════════════════════
function allCalEvents(){
  const syncedIds=new Set(S.events.filter(e=>e.gcalId).map(e=>e.gcalId));
  return [...S.events.filter(e=>!e.gcalId),...S.events.filter(e=>e.gcalId),...gcal.events.filter(e=>!syncedIds.has(e.gcalId))];
}
function renderCalendar(){
  const yr=S.calYear,mo=S.calMonth;
  el('calMonthLabel').textContent=`${t('months')[mo]} ${yr}`;
  const di=el('newEventDate');if(di&&!di.value)di.value=S.calSelected;
  const events=allCalEvents();
  const dotMap={};
  events.forEach(ev=>{if(!dotMap[ev.date])dotMap[ev.date]=[];dotMap[ev.date].push(ev.gcal?'#4285f4':getPersonColor(ev.person));});
  let html=t('dows').map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const firstDay=new Date(yr,mo,1).getDay(),daysInMo=new Date(yr,mo+1,0).getDate(),daysInPrev=new Date(yr,mo,0).getDate();
  for(let i=firstDay-1;i>=0;i--) html+=dayCell(`${yr}-${String(mo).padStart(2,'0')}-${String(daysInPrev-i).padStart(2,'0')}`,daysInPrev-i,true,dotMap);
  for(let d=1;d<=daysInMo;d++)   html+=dayCell(`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,d,false,dotMap);
  const rem=(firstDay+daysInMo)%7===0?0:7-(firstDay+daysInMo)%7;
  for(let d=1;d<=rem;d++)        html+=dayCell(`${yr}-${String(mo+2).padStart(2,'0')}-${String(d).padStart(2,'0')}`,d,true,dotMap);
  el('calGrid').innerHTML=html;
  renderDayPanel(events);
}
function dayCell(dateStr,num,other,dotMap){
  const isTod=dateStr===today,isSel=dateStr===S.calSelected;
  const dots=(dotMap[dateStr]||[]).slice(0,5);
  const cls=['cal-day',other?'other-month':'',isTod?'today':'',isSel?'selected':''].filter(Boolean).join(' ');
  return `<div class="${cls}" onclick="selectDay('${dateStr}')">
    <span class="cal-day-num">${num}</span>
    <div class="cal-dots">${dots.map(c=>`<span class="cal-dot" style="background:${c}"></span>`).join('')}</div>
  </div>`;
}
function selectDay(dateStr){S.calSelected=dateStr;const di=el('newEventDate');if(di)di.value=dateStr;renderCalendar();}
function renderDayPanel(events){
  const evs=(events||allCalEvents()).filter(e=>e.date===S.calSelected).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const title=S.calSelected===today?t('todayLabel'):fmtDateLong(S.calSelected);
  let html=`<div class="day-panel-title">📆 ${title}</div>`;
  if(!evs.length){html+=`<div class="empty" style="padding:12px">${t('noEvents')}</div>`;}
  else html+=evs.map(e=>{
    const color=e.gcal?'#4285f4':getPersonColor(e.person);
    const personLabel=e.gcal?'':(e.person==='All'?`👨‍👩‍👧‍👧 ${t('everyone')}`:(getEmoji(e.person)||'')+' '+e.person);
    const canDel=isParent()&&(!e.gcal||gcalConnected());
    return `<div class="event-item ${e.gcal?'gcal-event':''}" style="border-inline-start-color:${color}">
      <div class="event-body">
        <div class="event-title">${e.gcal?'<span class="g-badge">G</span>':''}${esc(e.title)}</div>
        <div class="event-meta">${e.time?'🕐 '+e.time:t('allDay')}${e.gcal?' '+t('gcalSource'):''}</div>
      </div>
      ${personLabel?`<span class="event-person-chip" style="background:${color}22;color:${color}">${personLabel}</span>`:''}
      ${canDel?`<button class="del-btn" onclick="deleteEvent(${e.id},'${e.gcalId||''}')">×</button>`:''}</div>`;
  }).join('');
  el('dayPanel').innerHTML=html;
}
function calShift(d){S.calMonth+=d;if(S.calMonth>11){S.calMonth=0;S.calYear++;}if(S.calMonth<0){S.calMonth=11;S.calYear--;}renderCalendar();}
async function addEvent(){
  if(!isParent())return;
  const title=el('newEventTitle').value.trim(),date=el('newEventDate').value;
  if(!title||!date)return;
  const ev={id:Date.now(),title,date,time:el('newEventTime').value,person:el('newEventPerson').value};
  if(gcalConnected()){const gcalId=await gcalCreateEvent(ev);if(gcalId)ev.gcalId=gcalId;}
  S.events.push(ev);el('newEventTitle').value='';el('newEventTime').value='';
  S.calSelected=date;const d2=new Date(date+'T00:00:00');S.calYear=d2.getFullYear();S.calMonth=d2.getMonth();
  save();if(gcalConnected())await fetchGCalEvents();else renderCalendar();
}
async function deleteEvent(id,gcalId){
  if(!isParent())return;
  if(gcalId&&gcalConnected())await gcalDeleteEvent(gcalId);
  if(typeof id==='number')S.events=S.events.filter(x=>x.id!==id);
  save();if(gcalConnected())await fetchGCalEvents();else renderCalendar();
}

const TABS=['home','chores','grocery','homework','calendar'];
function switchTab(tab){
  S.tab=tab;
  document.querySelectorAll('.tab').forEach((e,i)=>e.classList.toggle('active',TABS[i]===tab));
  document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
  el('tab-'+tab).classList.add('active');
}
function setFilter(name){
  S.filter=(S.filter===name&&name!=='All')?'All':name;
  renderHeader();renderHome();renderChores();
}

    if (user) {
      S.uid = user.uid;
      el('authScreen').classList.add('hidden');
      subscribeToFamily(user.uid);
    } else {
      S.uid = null; familyData = null;
      el('loadingScreen').classList.add('hidden');
      el('authScreen').classList.remove('hidden');
      setAuthMode('signin');
    }
  });
}
