<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyHub 🏠</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Nunito', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      max-width: 520px;
      margin: 0 auto;
      padding-bottom: 32px;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #6a11cb 0%, #f093fb 55%, #f5576c 100%);
      padding: 22px 16px 14px;
      color: white;
    }
    .header-title {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.5px;
    }
    .header-date {
      font-size: 13px;
      opacity: 0.85;
      font-weight: 600;
      margin-top: 2px;
      margin-bottom: 16px;
    }

    /* ── Avatar filter row ── */
    .avatar-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
    }
    .avatar-row::-webkit-scrollbar { display: none; }
    .avatar-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }
    .avatar-chip:active { transform: scale(0.9); }
    .avatar-bubble {
      width: 46px;
      height: 46px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border: 2.5px solid rgba(255,255,255,0.4);
      transition: all 0.2s;
    }
    .avatar-chip.active .avatar-bubble {
      background: white;
      border-color: white;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.4);
    }
    .avatar-label {
      font-size: 10px;
      font-weight: 800;
      margin-top: 4px;
      opacity: 0.9;
    }

    /* ── Tab bar ── */
    .tab-bar {
      display: flex;
      background: white;
      border-bottom: 2px solid #e8edf5;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    }
    .tab {
      flex: 1;
      padding: 11px 4px 9px;
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      color: #9aa5b8;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      user-select: none;
    }
    .tab.active { color: #6a11cb; border-bottom-color: #6a11cb; }
    .tab-icon { font-size: 19px; display: block; margin-bottom: 2px; }

    /* ── Content ── */
    .content { padding: 14px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── Cards ── */
    .card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 14px rgba(0,0,0,0.06);
    }
    .card-title {
      font-size: 16px;
      font-weight: 900;
      color: #1a202c;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── Task rows ── */
    .task-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 0;
      border-bottom: 1px solid #f3f6ff;
    }
    .task-row:last-of-type { border-bottom: none; padding-bottom: 0; }
    .task-row:first-of-type { padding-top: 0; }

    .check-box {
      width: 24px;
      height: 24px;
      border-radius: 7px;
      border: 2px solid #c8d3e8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 13px;
      transition: all 0.18s;
    }
    .check-box.done {
      background: linear-gradient(135deg, #6a11cb, #f093fb);
      border-color: transparent;
      color: white;
    }

    .task-text {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
      color: #2d3748;
    }
    .task-text.done { text-decoration: line-through; color: #a0aec0; }

    .mini-avatar {
      font-size: 18px;
      width: 30px;
      height: 30px;
      background: #f3f6ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .del-btn {
      background: none;
      border: none;
      font-size: 17px;
      cursor: pointer;
      opacity: 0.35;
      line-height: 1;
      padding: 0 3px;
      transition: opacity 0.15s;
    }
    .del-btn:hover { opacity: 0.7; }

    /* ── Priority badges ── */
    .pri {
      font-size: 9px;
      font-weight: 900;
      padding: 2px 7px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      flex-shrink: 0;
    }
    .pri-high   { background: #fff0f0; color: #e53e3e; }
    .pri-medium { background: #fffbeb; color: #c87b00; }
    .pri-low    { background: #f0fff4; color: #38a169; }

    /* ── Star chart ── */
    .star-chart { display: flex; flex-direction: column; gap: 13px; }
    .star-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .star-person {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 80px;
    }
    .star-person-emoji { font-size: 20px; }
    .star-person-name { font-size: 13px; font-weight: 800; color: #2d3748; }
    .stars { display: flex; gap: 3px; }
    .star {
      font-size: 24px;
      cursor: pointer;
      transition: transform 0.15s;
      filter: grayscale(1) opacity(0.25);
      line-height: 1;
    }
    .star.on  { filter: none; }
    .star:hover { transform: scale(1.25); }
    .star-count {
      font-size: 11px;
      color: #a0aec0;
      font-weight: 800;
      margin-left: 3px;
    }

    /* ── Subject badges ── */
    .badge {
      font-size: 10px;
      font-weight: 900;
      padding: 3px 9px;
      border-radius: 20px;
      flex-shrink: 0;
    }
    .b-Maths   { background: #ebf4ff; color: #2b6cb0; }
    .b-English { background: #f0fff4; color: #276749; }
    .b-Science { background: #faf5ff; color: #6b46c1; }
    .b-History { background: #fffaf0; color: #c05621; }
    .b-Art     { background: #fff5f7; color: #b83280; }

    /* ── Homework items ── */
    .hw-item {
      padding: 10px 0;
      border-bottom: 1px solid #f3f6ff;
    }
    .hw-item:last-child { border-bottom: none; }
    .hw-head {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .hw-desc-text {
      flex: 1;
      font-size: 13px;
      font-weight: 700;
      color: #2d3748;
    }
    .hw-desc-text.done { text-decoration: line-through; color: #a0aec0; }
    .hw-due {
      font-size: 11px;
      color: #a0aec0;
      font-weight: 600;
      margin-top: 4px;
      margin-left: 31px;
    }

    /* ── Grocery ── */
    .grocery-add {
      display: flex;
      gap: 7px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .g-input {
      flex: 1;
      min-width: 120px;
      padding: 9px 13px;
      border: 2px solid #e8edf5;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s;
    }
    .g-input:focus { border-color: #6a11cb; }

    .g-cat {
      padding: 9px 8px;
      border: 2px solid #e8edf5;
      border-radius: 12px;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      outline: none;
      background: white;
      cursor: pointer;
    }

    .g-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      background: #f8faff;
      border-radius: 11px;
      margin-bottom: 6px;
    }
    .g-item-text {
      flex: 1;
      font-size: 14px;
      font-weight: 700;
      color: #2d3748;
    }
    .g-item-text.done { text-decoration: line-through; color: #a0aec0; }

    .cat-title {
      font-size: 11px;
      font-weight: 900;
      color: #8896ab;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin: 10px 0 7px;
    }
    .cat-title:first-child { margin-top: 0; }

    /* ── Buttons ── */
    .btn {
      padding: 9px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6a11cb, #f093fb);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.18s, transform 0.12s;
      flex-shrink: 0;
    }
    .btn:active { opacity: 0.8; transform: scale(0.96); }
    .btn-sm {
      padding: 8px 14px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #6a11cb, #f093fb);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.18s;
      flex-shrink: 0;
    }
    .btn-ghost {
      padding: 6px 12px;
      border: none;
      border-radius: 9px;
      background: #f0f4ff;
      color: #718096;
      font-family: 'Nunito', sans-serif;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: block;
      margin-top: 10px;
      margin-left: auto;
    }
    .btn-ghost:hover { background: #e2e8f0; }

    /* ── Add forms ── */
    .add-form {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1.5px dashed #e8edf5;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-row { display: flex; gap: 7px; }
    .add-input {
      flex: 1;
      padding: 9px 12px;
      border: 2px solid #e8edf5;
      border-radius: 11px;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 700;
      outline: none;
    }
    .add-input:focus { border-color: #6a11cb; }

    select {
      padding: 9px 8px;
      border: 2px solid #e8edf5;
      border-radius: 11px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      background: white;
      cursor: pointer;
    }
    select:focus { border-color: #6a11cb; }

    input[type="date"] {
      padding: 9px 8px;
      border: 2px solid #e8edf5;
      border-radius: 11px;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 700;
      outline: none;
      background: white;
    }
    input[type="date"]:focus { border-color: #6a11cb; }

    /* ── Child tabs (homework) ── */
    .child-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .child-tab {
      padding: 7px 16px;
      border-radius: 22px;
      background: #f0f4ff;
      font-size: 13px;
      font-weight: 800;
      color: #718096;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .child-tab.active {
      background: linear-gradient(135deg, #6a11cb, #f093fb);
      color: white;
    }

    /* ── Person header in chores ── */
    .person-header {
      font-size: 15px;
      font-weight: 900;
      color: #1a202c;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 22px;
      color: #a0aec0;
      font-size: 14px;
      font-weight: 700;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #c8d3e8; border-radius: 4px; }
  </style>
</head>
<body>

<!-- ════════════════ HEADER ════════════════ -->
<div class="header">
  <div class="header-title">🏠 FamilyHub</div>
  <div class="header-date" id="headerDate"></div>
  <div class="avatar-row" id="avatarRow"></div>
</div>

<!-- ════════════════ TAB BAR ════════════════ -->
<div class="tab-bar">
  <div class="tab active" onclick="switchTab('home')">
    <span class="tab-icon">🏡</span>Home
  </div>
  <div class="tab" onclick="switchTab('chores')">
    <span class="tab-icon">✅</span>Chores
  </div>
  <div class="tab" onclick="switchTab('grocery')">
    <span class="tab-icon">🛒</span>Grocery
  </div>
  <div class="tab" onclick="switchTab('homework')">
    <span class="tab-icon">📚</span>Homework
  </div>
</div>

<!-- ════════════════ CONTENT ════════════════ -->
<div class="content">

  <!-- ── HOME ── -->
  <div id="tab-home" class="tab-content active">
    <div class="card">
      <div class="card-title">⚡ Today's Chores</div>
      <div id="homeTasks"></div>
    </div>

    <div class="card">
      <div class="card-title">⭐ Star Chart</div>
      <div class="star-chart" id="starChart"></div>
    </div>

    <div class="card">
      <div class="card-title">📋 Homework Due Soon</div>
      <div id="hwSummary"></div>
    </div>
  </div>

  <!-- ── CHORES ── -->
  <div id="tab-chores" class="tab-content">
    <div id="choresContent"></div>

    <div class="card">
      <div class="card-title">➕ Add Chore</div>
      <div class="add-form">
        <input class="add-input" id="newChoreText" type="text" placeholder="What needs doing…" onkeydown="if(event.key==='Enter')addChore()">
        <div class="form-row">
          <select id="newChoreAssignee" style="flex:1">
            <option value="Zohar">👩 Zohar</option>
            <option value="Nir">👨 Nir</option>
            <option value="Roni">👧 Roni</option>
            <option value="Shira">🧒 Shira</option>
            <option value="Noya">👶 Noya</option>
          </select>
          <select id="newChorePriority" style="flex:1">
            <option value="high">🔴 High</option>
            <option value="medium">🟡 Medium</option>
            <option value="low">🟢 Low</option>
          </select>
          <button class="btn-sm" onclick="addChore()">Add</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── GROCERY ── -->
  <div id="tab-grocery" class="tab-content">
    <div class="card">
      <div class="card-title">🛒 Shopping List</div>
      <div class="grocery-add">
        <input class="g-input" id="groceryItem" type="text" placeholder="Add item…" onkeydown="if(event.key==='Enter')addGrocery()">
        <select class="g-cat" id="groceryCat">
          <option value="Fruit &amp; Veg">🥦 Fruit &amp; Veg</option>
          <option value="Dairy &amp; Eggs">🥛 Dairy &amp; Eggs</option>
          <option value="Pantry">🥫 Pantry</option>
          <option value="Meat &amp; Fish">🥩 Meat &amp; Fish</option>
        </select>
        <button class="btn" onclick="addGrocery()">＋</button>
      </div>
      <div id="groceryList"></div>
      <button class="btn-ghost" onclick="clearChecked()">🗑 Clear checked</button>
    </div>
  </div>

  <!-- ── HOMEWORK ── -->
  <div id="tab-homework" class="tab-content">
    <div class="child-tabs" id="childTabs">
      <div class="child-tab active" onclick="switchChild('Roni')">👧 Roni</div>
      <div class="child-tab"        onclick="switchChild('Shira')">🧒 Shira</div>
      <div class="child-tab"        onclick="switchChild('Noya')">👶 Noya</div>
    </div>

    <div class="card">
      <div class="card-title" id="hwCardTitle">📖 Roni's Homework</div>
      <div id="hwList"></div>

      <div class="add-form">
        <input class="add-input" id="hwDesc" type="text" placeholder="Assignment description…">
        <div class="form-row">
          <select id="hwSubject" style="flex:1">
            <option value="Maths">📐 Maths</option>
            <option value="English">📝 English</option>
            <option value="Science">🔬 Science</option>
            <option value="History">🏛 History</option>
            <option value="Art">🎨 Art</option>
          </select>
          <input type="date" id="hwDue" style="flex:1">
          <button class="btn-sm" onclick="addHomework()">Add</button>
        </div>
      </div>
    </div>
  </div>

</div><!-- /content -->

<script>
// ════════════════════════════════════════
//  CONSTANTS
// ════════════════════════════════════════
const FAMILY = [
  { name:'All',   emoji:'👨‍👩‍👧‍👧' },
  { name:'Zohar', emoji:'👩' },
  { name:'Nir',   emoji:'👨' },
  { name:'Roni',  emoji:'👧' },
  { name:'Shira', emoji:'🧒' },
  { name:'Noya',  emoji:'👶' },
];
const KIDS = ['Roni','Shira','Noya'];
const EMOJI = { Zohar:'👩', Nir:'👨', Roni:'👧', Shira:'🧒', Noya:'👶' };
const CATS  = ['Fruit & Veg','Dairy & Eggs','Pantry','Meat & Fish'];
const CAT_EM = { 'Fruit & Veg':'🥦','Dairy & Eggs':'🥛','Pantry':'🥫','Meat & Fish':'🥩' };

// ════════════════════════════════════════
//  DEFAULT DATA
// ════════════════════════════════════════
const D_CHORES = [
  { id:1,  text:'Prepare dinner',       assignee:'Zohar', priority:'high',   done:false },
  { id:2,  text:'Grocery run',          assignee:'Nir',   priority:'medium', done:false },
  { id:3,  text:'Take out trash',       assignee:'Nir',   priority:'high',   done:false },
  { id:4,  text:'Water the plants',     assignee:'Zohar', priority:'low',    done:false },
  { id:5,  text:'Clean bedroom',        assignee:'Roni',  priority:'medium', done:false },
  { id:6,  text:'Fold laundry',         assignee:'Roni',  priority:'low',    done:false },
  { id:7,  text:'Set the table',        assignee:'Shira', priority:'low',    done:false },
  { id:8,  text:'Feed the fish',        assignee:'Shira', priority:'medium', done:false },
  { id:9,  text:'Tidy toys away',       assignee:'Noya',  priority:'low',    done:false },
  { id:10, text:'Help pack school bag', assignee:'Noya',  priority:'medium', done:false },
];

const D_GROCERY = [
  { id:1, text:'Apples',        category:'Fruit & Veg',  checked:false },
  { id:2, text:'Bananas',       category:'Fruit & Veg',  checked:false },
  { id:3, text:'Baby carrots',  category:'Fruit & Veg',  checked:false },
  { id:4, text:'Milk',          category:'Dairy & Eggs', checked:false },
  { id:5, text:'Eggs (12)',     category:'Dairy & Eggs', checked:false },
  { id:6, text:'Yellow cheese', category:'Dairy & Eggs', checked:false },
  { id:7, text:'Pasta',         category:'Pantry',       checked:false },
  { id:8, text:'Tomato sauce',  category:'Pantry',       checked:false },
  { id:9, text:'Olive oil',     category:'Pantry',       checked:false },
  { id:10,text:'Chicken breast',category:'Meat & Fish',  checked:false },
  { id:11,text:'Salmon fillet', category:'Meat & Fish',  checked:false },
];

const tomorrow = new Date(Date.now()+864e5).toISOString().slice(0,10);
const today    = new Date().toISOString().slice(0,10);

const D_HW = [
  { id:1, child:'Roni',  subject:'Maths',   desc:'Chapter 5 exercises pg 42-43',  due:tomorrow, done:false },
  { id:2, child:'Roni',  subject:'English', desc:'Book report first draft',        due:today,    done:false },
  { id:3, child:'Shira', subject:'Science', desc:'Draw & label the water cycle',   due:tomorrow, done:false },
  { id:4, child:'Shira', subject:'Art',     desc:'Finish self-portrait in colour', due:today,    done:false },
  { id:5, child:'Noya',  subject:'Maths',   desc:'Count to 100 worksheet',         due:today,    done:false },
  { id:6, child:'Noya',  subject:'Art',     desc:'Draw my favourite animal',       due:tomorrow, done:false },
];

const D_STARS = { Roni:3, Shira:4, Noya:2 };

// ════════════════════════════════════════
//  STATE
// ════════════════════════════════════════
let S = {
  tab:    'home',
  filter: 'All',
  child:  'Roni',
  chores: [],
  grocery:[],
  homework:[],
  stars:  {},
};

// ════════════════════════════════════════
//  PERSISTENCE
// ════════════════════════════════════════
function save() {
  localStorage.setItem('familyhub_v2', JSON.stringify({
    chores:  S.chores,
    grocery: S.grocery,
    homework:S.homework,
    stars:   S.stars,
  }));
}

function load() {
  const raw = localStorage.getItem('familyhub_v2');
  if (raw) {
    const d = JSON.parse(raw);
    S.chores   = d.chores   || D_CHORES;
    S.grocery  = d.grocery  || D_GROCERY;
    S.homework = d.homework || D_HW;
    S.stars    = d.stars    || D_STARS;
  } else {
    S.chores   = D_CHORES;
    S.grocery  = D_GROCERY;
    S.homework = D_HW;
    S.stars    = { ...D_STARS };
  }
}

// ════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════
function fmtDate(str) {
  if (!str) return '';
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ════════════════════════════════════════
//  RENDER — HEADER
// ════════════════════════════════════════
function renderHeader() {
  const now = new Date();
  document.getElementById('headerDate').textContent =
    now.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });

  document.getElementById('avatarRow').innerHTML = FAMILY.map(f => `
    <div class="avatar-chip ${S.filter===f.name?'active':''}" onclick="setFilter('${f.name}')">
      <div class="avatar-bubble">${f.emoji}</div>
      <div class="avatar-label">${f.name==='All'?'All':f.name}</div>
    </div>
  `).join('');
}

// ════════════════════════════════════════
//  RENDER — HOME TAB
// ════════════════════════════════════════
function renderHome() {
  // Today's chores (not done, filtered)
  let tasks = S.chores.filter(c => !c.done);
  if (S.filter !== 'All') tasks = tasks.filter(c => c.assignee === S.filter);

  const taskEl = document.getElementById('homeTasks');
  taskEl.innerHTML = tasks.length ? tasks.slice(0,8).map(c => `
    <div class="task-row">
      <div class="check-box ${c.done?'done':''}" onclick="toggleChore(${c.id})">${c.done?'✓':''}</div>
      <div class="task-text ${c.done?'done':''}">${esc(c.text)}</div>
      <div class="mini-avatar">${EMOJI[c.assignee]||'👤'}</div>
      <span class="pri pri-${c.priority}">${c.priority}</span>
    </div>
  `).join('') : '<div class="empty">🎉 All chores done! Go team!</div>';

  // Star chart
  renderStarChart();

  // HW summary
  let hw = S.homework.filter(h => !h.done);
  if (S.filter !== 'All' && KIDS.includes(S.filter)) hw = hw.filter(h => h.child === S.filter);

  const hwEl = document.getElementById('hwSummary');
  hwEl.innerHTML = hw.length ? hw.slice(0,5).map(h => `
    <div class="task-row">
      <div class="mini-avatar">${EMOJI[h.child]||'👤'}</div>
      <div class="task-text">${esc(h.desc)}</div>
      <span class="badge b-${esc(h.subject)}">${esc(h.subject)}</span>
    </div>
  `).join('') : '<div class="empty">📭 No pending homework!</div>';
}

// ════════════════════════════════════════
//  STAR CHART
// ════════════════════════════════════════
function renderStarChart() {
  document.getElementById('starChart').innerHTML = KIDS.map(kid => `
    <div class="star-row">
      <div class="star-person">
        <span class="star-person-emoji">${EMOJI[kid]}</span>
        <span class="star-person-name">${kid}</span>
      </div>
      <div class="stars">
        ${[1,2,3,4,5].map(i => `
          <span class="star ${(S.stars[kid]||0)>=i?'on':''}" onclick="setStar('${kid}',${i})">⭐</span>
        `).join('')}
      </div>
      <span class="star-count">${S.stars[kid]||0}/5</span>
    </div>
  `).join('');
}

function setStar(kid, val) {
  S.stars[kid] = S.stars[kid] === val ? val - 1 : val;
  save();
  renderStarChart();
}

// ════════════════════════════════════════
//  RENDER — CHORES TAB
// ════════════════════════════════════════
function renderChores() {
  const people = ['Zohar','Nir','Roni','Shira','Noya'];
  let items = S.filter === 'All' ? S.chores : S.chores.filter(c => c.assignee === S.filter);

  const grouped = {};
  people.forEach(p => grouped[p] = []);
  items.forEach(c => { if (grouped[c.assignee]) grouped[c.assignee].push(c); });

  let html = '';
  people.forEach(p => {
    if (!grouped[p].length) return;
    html += `<div class="card">
      <div class="person-header">${EMOJI[p]} ${p}</div>
      ${grouped[p].map(c => `
        <div class="task-row">
          <div class="check-box ${c.done?'done':''}" onclick="toggleChore(${c.id})">${c.done?'✓':''}</div>
          <div class="task-text ${c.done?'done':''}">${esc(c.text)}</div>
          <span class="pri pri-${c.priority}">${c.priority}</span>
          <button class="del-btn" onclick="deleteChore(${c.id})">×</button>
        </div>
      `).join('')}
    </div>`;
  });

  document.getElementById('choresContent').innerHTML =
    html || '<div class="card"><div class="empty">No chores to show 🎉</div></div>';
}

function toggleChore(id) {
  const c = S.chores.find(x => x.id === id);
  if (c) { c.done = !c.done; save(); renderHome(); renderChores(); }
}
function deleteChore(id) {
  S.chores = S.chores.filter(x => x.id !== id);
  save(); renderHome(); renderChores();
}
function addChore() {
  const text = document.getElementById('newChoreText').value.trim();
  if (!text) return;
  S.chores.push({
    id: Date.now(),
    text,
    assignee: document.getElementById('newChoreAssignee').value,
    priority: document.getElementById('newChorePriority').value,
    done: false,
  });
  document.getElementById('newChoreText').value = '';
  save(); renderHome(); renderChores();
}

// ════════════════════════════════════════
//  RENDER — GROCERY TAB
// ════════════════════════════════════════
function renderGrocery() {
  let html = '';
  CATS.forEach(cat => {
    const items = S.grocery.filter(g => g.category === cat);
    if (!items.length) return;
    html += `<div class="cat-title">${CAT_EM[cat]} ${cat}</div>`;
    html += items.map(g => `
      <div class="g-item">
        <div class="check-box ${g.checked?'done':''}" onclick="toggleGrocery(${g.id})">${g.checked?'✓':''}</div>
        <div class="g-item-text ${g.checked?'done':''}">${esc(g.text)}</div>
        <button class="del-btn" onclick="deleteGrocery(${g.id})">🗑</button>
      </div>
    `).join('');
  });
  document.getElementById('groceryList').innerHTML =
    html || '<div class="empty">🛒 List is empty — add items above!</div>';
}

function addGrocery() {
  const text = document.getElementById('groceryItem').value.trim();
  if (!text) return;
  S.grocery.push({ id: Date.now(), text, category: document.getElementById('groceryCat').value, checked: false });
  document.getElementById('groceryItem').value = '';
  save(); renderGrocery();
}
function toggleGrocery(id) {
  const g = S.grocery.find(x => x.id === id);
  if (g) { g.checked = !g.checked; save(); renderGrocery(); }
}
function deleteGrocery(id) {
  S.grocery = S.grocery.filter(x => x.id !== id);
  save(); renderGrocery();
}
function clearChecked() {
  S.grocery = S.grocery.filter(g => !g.checked);
  save(); renderGrocery();
}

// ════════════════════════════════════════
//  RENDER — HOMEWORK TAB
// ════════════════════════════════════════
function renderHomework() {
  document.getElementById('hwCardTitle').textContent = `📖 ${S.child}'s Homework`;

  // Update child tab styles
  document.querySelectorAll('.child-tab').forEach(el => {
    el.classList.toggle('active', el.textContent.trim().includes(S.child));
  });

  const items = S.homework.filter(h => h.child === S.child);
  document.getElementById('hwList').innerHTML = items.length ? items.map(h => `
    <div class="hw-item">
      <div class="hw-head">
        <div class="check-box ${h.done?'done':''}" onclick="toggleHW(${h.id})">${h.done?'✓':''}</div>
        <span class="badge b-${esc(h.subject)}">${esc(h.subject)}</span>
        <div class="hw-desc-text ${h.done?'done':''}">${esc(h.desc)}</div>
        <button class="del-btn" onclick="deleteHW(${h.id})">×</button>
      </div>
      ${h.due ? `<div class="hw-due">📅 Due: ${fmtDate(h.due)}</div>` : ''}
    </div>
  `).join('') : '<div class="empty">No homework! 🎉</div>';
}

function switchChild(child) {
  S.child = child;
  renderHomework();
}
function toggleHW(id) {
  const h = S.homework.find(x => x.id === id);
  if (h) { h.done = !h.done; save(); renderHomework(); renderHome(); }
}
function deleteHW(id) {
  S.homework = S.homework.filter(x => x.id !== id);
  save(); renderHomework(); renderHome();
}
function addHomework() {
  const desc = document.getElementById('hwDesc').value.trim();
  if (!desc) return;
  S.homework.push({
    id: Date.now(),
    child:   S.child,
    subject: document.getElementById('hwSubject').value,
    desc,
    due:     document.getElementById('hwDue').value,
    done:    false,
  });
  document.getElementById('hwDesc').value = '';
  save(); renderHomework(); renderHome();
}

// ════════════════════════════════════════
//  TAB SWITCHING
// ════════════════════════════════════════
const TABS = ['home','chores','grocery','homework'];

function switchTab(tab) {
  S.tab = tab;
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', TABS[i]===tab));
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
}

// ════════════════════════════════════════
//  FILTER
// ════════════════════════════════════════
function setFilter(name) {
  S.filter = (S.filter === name && name !== 'All') ? 'All' : name;
  renderHeader();
  renderHome();
  renderChores();
}

// ════════════════════════════════════════
//  INIT
// ════════════════════════════════════════
load();
renderHeader();
renderHome();
renderChores();
renderGrocery();
renderHomework();
</script>
</body>
</html>
