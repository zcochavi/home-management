name: Bump asset version on deploy

on:
  push:
    branches: [gh-pages]
    paths:
      - 'app.js'
      - 'styles.css'

jobs:
  bump-version:
    name: Update cache-busting version in index.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version string
        run: |
          VER=$(date +'%Y%m%d')-$(git rev-parse --short HEAD)
          sed -i "s|app\.js?v=[^\"]*|app.js?v=${VER}|g" index.html
          sed -i "s|styles\.css?v=[^\"]*|styles.css?v=${VER}|g" index.html
          echo "Version bumped to ${VER}"

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: bump asset version for cache busting [skip ci]"
          git push
