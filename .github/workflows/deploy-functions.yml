name: Deploy Firebase Functions, Rules & Hosting

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'hosting/**'

jobs:
  deploy-functions:
    name: Deploy Cloud Functions, Firestore Rules & Hosting
    # Manual runs are only allowed from the deploy branch
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      - name: Deploy to Firebase
        run: npx firebase-tools@latest deploy --only functions,firestore:rules,hosting --project familyhub-7fdd5
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
