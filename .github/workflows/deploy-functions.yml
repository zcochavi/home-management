name: Deploy Firebase Functions, Rules & Hosting

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firebase.json'
      - 'hosting/**'

jobs:
  deploy-functions:
    name: Deploy Cloud Functions, Firestore Rules & Hosting
    # Manual runs are only allowed from the deploy branch
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: functions

      - name: Write service account credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json

      # 2nd-gen functions in me-west1 need an artifact cleanup policy, or the
      # deploy exits with an error after the functions are already created.
      - name: Set artifact cleanup policy (me-west1)
        continue-on-error: true
        run: npx firebase-tools@latest functions:artifacts:setpolicy --location me-west1 --force --project familyhub-7fdd5
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      # Rules and hosting on their own, so a functions problem never holds them back
      - name: Deploy Firestore rules & hosting
        run: npx firebase-tools@latest deploy --only firestore:rules,hosting --project familyhub-7fdd5 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json

      # Functions in batches: all at once runs into Google Cloud's limit on function updates
      - name: Deploy Cloud Functions (batched)
        run: .github/scripts/deploy-functions-batched.sh
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          PROJECT: familyhub-7fdd5
          BATCH_SIZE: '10'
          PAUSE: '30'
