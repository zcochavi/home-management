name: Enforce deploy flow

on:
  pull_request:
    branches: [gh-pages]
    types: [opened, synchronize, reopened]

jobs:
  check-source-branch:
    name: Source branch must be main
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main → gh-pages flow
        run: |
          if [ "${{ github.head_ref }}" != "main" ]; then
            echo "❌ PRs to gh-pages must come from 'main', not '${{ github.head_ref }}'."
            echo "   Correct flow: feature branch → PR to main → PR to gh-pages"
            exit 1
          fi
          echo "✅ Source branch is main — deploy flow is correct"
