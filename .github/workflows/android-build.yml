name: Build Android app

# Builds an installable debug APK of the FamilyHub Android app (the web app
# wrapped with Capacitor). Download it from the run's "Artifacts" section.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - '.github/workflows/android-build.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor
        run: npm ci
        working-directory: mobile

      - name: Copy web app into the Android project
        run: npm run sync
        working-directory: mobile

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: mobile/android

      - uses: actions/upload-artifact@v4
        with:
          name: familyhub-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
